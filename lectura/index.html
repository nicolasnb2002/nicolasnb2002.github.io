<style>
  :root { --ink:#0e1114; --ink2:#151a1f; --line:#2c343d; --paper:#efe8d8; --muted:#a39e90; --faint:#736e64; --brass:#d4a24a; --brass2:#f3ddb0; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--ink); color:var(--paper); font-family:"IBM Plex Sans", sans-serif; }
  button, a { cursor:pointer; }
  a { color:inherit; text-decoration:none; }
  button { font:inherit; background:none; border:0; color:inherit; }
  .wrap { max-width: 64rem; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
  .top { display:flex; justify-content:space-between; align-items:center; }
  .serif { font-family: Newsreader, Georgia, serif; }
  .mono { font-family: "IBM Plex Mono", monospace; }
  h1 { font-family: Newsreader, Georgia, serif; font-weight: 560; font-size: clamp(2.6rem, 7vw, 4.2rem); line-height: .95; letter-spacing: -0.02em; margin: .6rem 0 0; }
  .kicker { color: var(--brass); letter-spacing: .16em; text-transform: uppercase; font-size: .72rem; }
  .muted { color: var(--muted); }
  .faint { color: var(--faint); }
  .cta { display:inline-flex; align-items:center; height: 3rem; padding: 0 1.3rem; background: var(--brass); color: var(--ink); font-weight: 500; margin-top: 1.5rem; }
  .grid { display:grid; gap: 2.5rem; margin-top: 3rem; }
  @media (min-width: 900px) { .grid { grid-template-columns: 1.2fr .8fr; align-items: end; } }
  ol { list-style: none; margin:0; padding:0; }
  .mod { display:grid; grid-template-columns: 2.4rem 1fr auto; gap: .7rem; padding: .75rem 0; border-bottom: 1px solid var(--line); }
  .card { display:block; border: 1px solid var(--line); background: var(--ink2); padding: 1rem; margin: 0 0 1rem 1.4rem; position: relative; }
  .card:hover { border-color: var(--brass); }
  .spine { position: relative; }
  .dot { position:absolute; left:0; top:.35rem; width:.7rem; height:.7rem; border:1px solid var(--line); background:var(--ink); }
  .dot.on { background: var(--brass); border-color: var(--brass); }
  .bar { height:1px; background: var(--line); margin-top: .8rem; }
  .bar > i { display:block; height:1px; background: var(--brass); }
  .lesson { display:grid; grid-template-columns: 2rem 1fr; gap:.6rem; padding: .9rem 0; border-bottom: 1px solid var(--line); }
  .point { border-left: 1px solid var(--brass); padding-left: .9rem; margin: .8rem 0; line-height: 1.55; }
  .ex { border:1px solid var(--line); background: var(--ink2); padding: 1rem; margin-top: 1.4rem; }
  .row { display:flex; justify-content:space-between; gap:1rem; border-top:1px solid var(--line); padding:.45rem 0; }
  .actions { display:flex; flex-wrap:wrap; gap:.6rem; margin-top: 1.4rem; }
  .primary { background: var(--brass); color: var(--ink); height: 3rem; padding: 0 1rem; }
  .ghost { border:1px solid var(--line); height: 3rem; padding: 0 1rem; }
  .nav { display:flex; justify-content:space-between; gap:1rem; margin-top: 1.6rem; font-size:.9rem; color: var(--muted); }
  header.sticky { position: sticky; top:0; background: rgba(14,17,20,.94); border-bottom: 1px solid var(--line); z-index: 2; }
  header.sticky .wrap { padding-top:.7rem; padding-bottom:.7rem; }
  input { height: 2.75rem; width:100%; background: var(--ink); color: var(--paper); border:1px solid var(--line); padding: 0 .6rem; font-family: "IBM Plex Mono", monospace; }
  label { display:flex; flex-direction:column; gap:.3rem; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color: var(--faint); }
  .fields { display:grid; gap:.7rem; margin-top: .8rem; }
  @media (min-width: 640px) { .fields.z { grid-template-columns: 1fr 1fr 1fr; } .fields.log { grid-template-columns: 1fr 1fr; } }
  .note { color: var(--faint); font-size: .9rem; margin-top: 2rem; }
